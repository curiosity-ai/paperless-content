# Standalone workspace so this dev-only helper lives entirely under dotnet/ without
# being registered in the root xberg workspace — keeps the Rust tree pristine for
# upstream merges. It path-depends on ../../../.reference/crates/xberg (whose own workspace
# inheritance still resolves against the root xberg workspace).
[workspace]

[package]
name = "xberg-reference-gen"
version = "0.1.0"
edition = "2024"
publish = false

# Helper tool for the C# port: walks the `test_documents` tree, runs the original
# Rust `xberg` content extractors over every fixture, and writes a golden
# `{filename}-results-rust.json` next to each source file. The C# port's test CLI
# compares its own output against these files. Content-extraction features only
# (no OCR / candle / embeddings / tree-sitter / transcription).

[[bin]]
name = "xberg-reference-gen"
path = "src/main.rs"

# `extended` adds the xberg features the default set leaves off — the ones the C# port
# is now growing counterparts for. Kept behind a cargo feature rather than switched on
# outright: they change what a fixture extracts to, so the two builds answer different
# questions and each needs its own golden set (see `--out`).
[features]
default = []
extended = [
    "xberg/tree-sitter",
    "xberg/qr-codes",
]
# Layout-aware reading order. Separate from `extended` because it needs ONNX Runtime and
# downloads model weights, so it is only worth building when the layout path is what is
# being measured.
layout = ["xberg/layout-detection"]
# WordPerfect via the vendored libwpd/librevenge C++ shim. Kept separate because it needs a C++
# toolchain and vendors boost; it exists so the managed reimplementation has a reference to be
# measured against.
wordperfect = ["xberg/wordperfect"]

[dependencies]
xberg = { path = "../../../.reference/crates/xberg", default-features = false, features = [
    "tokio-runtime",
    "office",
    "excel",
    "pdf",
    "html",
    "xml",
    "email",
    "archives",
    "hwp",
    "hwpx",
    "iwork",
    "mdx",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
